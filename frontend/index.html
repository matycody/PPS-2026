<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Cronómetro y seguimiento de partidos de Dodgeball Buenos Aires" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dodgeball BA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0a0b" />
    <script>
      // Aplica el tema antes de pintar, para evitar el parpadeo al cargar
      (function () {
        try {
          var m = localStorage.getItem('theme');
          var dark = m === 'light' ? false : m === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : true;
          document.documentElement.classList.toggle('dark', dark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0a0a0b' : '#f5f6f8');
        } catch (e) {}
      })();
    </script>
    <title>Dodgeball BA Cronómetro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
